<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4e79" />
  <meta name="description" content="EUNACOM — plataforma de estudio offline" />
  <title>EUNACOM — Estudio offline</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash__logo">EUNACOM</div>
    <div class="spinner"></div>
    <p id="splash-msg" class="muted">Iniciando…</p>
  </div>

  <header class="topbar">
    <button class="topbar__brand" data-nav="">EUNACOM</button>
    <button id="btn-instalar" class="btn btn--ghost btn--sm" hidden>Instalar app</button>
  </header>

  <main id="vista" class="vista"></main>

  <nav class="navbar">
    <button class="navbar__btn" data-nav=""><span>🏠</span>Inicio</button>
    <button class="navbar__btn" data-nav="quiz"><span>📝</span>Quiz</button>
    <button class="navbar__btn" data-nav="casos"><span>🩺</span>Casos</button>
    <button class="navbar__btn" data-nav="definiciones"><span>💡</span>Definir</button>
    <button class="navbar__btn" data-nav="progreso"><span>📊</span>Progreso</button>
  </nav>

  <script type="module" src="src/app.js"></script>
</body>
</html>
