<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4e79" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="InternOS — plataforma de estudio EUNACOM 100% offline" />
  <meta name="format-detection" content="telephone=no" />
  <title>InternOS — EUNACOM</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="InternOS" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="styles/app.css" />
  <!-- modulepreload del camino crítico: aplana el waterfall de imports ESM. -->
  <link rel="modulepreload" href="src/db/db.js" />
  <link rel="modulepreload" href="src/db/seed.js" />
  <link rel="modulepreload" href="src/ui/router.js" />
  <link rel="modulepreload" href="src/ui/dom.js" />
  <link rel="modulepreload" href="src/ui/home.js" />
  <link rel="modulepreload" href="src/version.js" />
</head>
<body>
  <div id="splash" class="splash">
    <img class="splash__logo" src="assets/icon.svg" alt="InternOS" />
    <p id="splash-version" class="splash__version muted">vdev</p>
    <div class="spinner"></div>
    <p id="splash-msg" class="muted">Iniciando…</p>
  </div>

  <header class="topbar">
    <button class="topbar__brand" data-nav="" aria-label="Inicio">
      <img class="topbar__logo" src="assets/icon.svg" alt="InternOS" />
    </button>
    <button id="btn-instalar" class="btn btn--ghost btn--sm" hidden>Instalar app</button>
  </header>

  <main id="vista" class="vista"></main>

  <nav class="navbar">
    <button class="navbar__btn" data-nav=""><span>🏠</span>Inicio</button>
    <button class="navbar__btn" data-nav="quiz"><span>📝</span>Quiz</button>
    <button class="navbar__btn" data-nav="casos"><span>🩺</span>Casos</button>
    <button class="navbar__btn" data-nav="definiciones"><span>💡</span>Definir</button>
    <button class="navbar__btn" data-nav="progreso"><span>📊</span>Progreso</button>
  </nav>

  <script type="module" src="src/app.js"></script>
</body>
</html>
