name: Deploy PWA to GitHub Pages

# Despliega el sitio estático (raíz del repo) en GitHub Pages
# automáticamente en cada push a main, y permite lanzarlo a mano.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; cancela los anteriores en curso.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
