name: Deploy PWA to GitHub Pages

# Despliega el sitio estático (raíz del repo) en GitHub Pages
# automáticamente en cada push a main, y permite lanzarlo a mano.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; cancela los anteriores en curso.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita Pages automáticamente (origen "GitHub Actions") si aún no lo está,
          # evitando el paso manual en Settings -> Pages.
          enablement: true

      - name: Estampar versión (semver + SHA + fecha)
        run: |
          APP_VERSION=$(cat VERSION | tr -d '[:space:]')
          GIT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Estampando v${APP_VERSION} build ${GIT_SHA} (${BUILD_DATE})"
          # data/version.json: leído por la app
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g; s/__GIT_SHA__/${GIT_SHA}/g; s/__BUILD_DATE__/${BUILD_DATE}/g" data/version.json
          # service-worker: cache name único por deploy (invalida automáticamente)
          sed -i "s/__GIT_SHA__/${GIT_SHA}/g" service-worker.js
          cat data/version.json

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
