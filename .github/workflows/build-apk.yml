name: Build Android APK (TWA)

# Compila el PWA en un APK firmado usando Bubblewrap (Trusted Web Activity).
# El APK envuelve https://amaturanas-sys.github.io/INTERN.OS/ y se firma con el
# keystore subido como secret KEYSTORE_BASE64.
#
# Se dispara manualmente desde Actions o automáticamente al pushear un tag vX.Y.Z.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (entero, incremental por release)"
        required: false
        default: "1"
      version_name:
        description: "versionName (vacío = usa el VERSION del repo)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Opt-in al runtime Node 24 (silencia el warning de deprecación de Node 20
      # en las JavaScript actions: checkout@v4, setup-java@v4, setup-node@v4,
      # setup-android@v3). Default obligatorio desde 16-jun-2026.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"

      - name: Aceptar licencias del SDK
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Instalar Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest

      - name: Preparar versión (versionName / versionCode)
        id: ver
        run: |
          INPUT_NAME='${{ github.event.inputs.version_name }}'
          if [ -z "${INPUT_NAME}" ]; then
            APP_VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            APP_VERSION="${INPUT_NAME}"
          fi
          INPUT_CODE='${{ github.event.inputs.version_code }}'
          VERSION_CODE="${INPUT_CODE:-1}"
          # Si se dispara por tag vX.Y.Z y no se forzó versionCode, calculamos un
          # versionCode estable a partir del run_number del workflow.
          if [ "${INPUT_CODE}" = "1" ] && [ "${{ github.event_name }}" = "push" ]; then
            VERSION_CODE="${{ github.run_number }}"
          fi
          echo "version_name=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Compilando APK v${APP_VERSION} (versionCode ${VERSION_CODE})"

      - name: Preparar workspace TWA + decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p twa
          cp twa-manifest.json twa/twa-manifest.json
          # Inyectar versionName + versionCode en el manifest
          node -e "
            const fs = require('fs');
            const p = './twa/twa-manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            m.appVersionName = '${{ steps.ver.outputs.version_name }}';
            m.appVersion = '${{ steps.ver.outputs.version_name }}';
            m.appVersionCode = parseInt('${{ steps.ver.outputs.version_code }}', 10);
            fs.writeFileSync(p, JSON.stringify(m, null, 2));
          "
          # Decodificar keystore desde el secret
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Falta secret KEYSTORE_BASE64"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > twa/android.keystore
          ls -la twa/

      - name: Instalar @bubblewrap/core (API programática)
        run: |
          # package.json mínimo para que npm install resuelva limpio
          [ -f package.json ] || echo '{"name":"internos-twa-builder","version":"0.0.0","private":true,"type":"module"}' > package.json
          npm install --no-save @bubblewrap/core@latest
          ls node_modules/@bubblewrap/core/ | head -20

      - name: Generar proyecto Android (API programática, sin prompts)
        run: |
          node scripts/generar-twa.mjs ./twa
          echo '--- app/build.gradle (cabecera) ---'
          [ -f twa/app/build.gradle ] && head -60 twa/app/build.gradle || echo 'no se generó app/build.gradle'

      - name: Inspeccionar configuración de firma generada
        working-directory: twa
        run: |
          echo '--- ANDROID_HOME ---'; echo "$ANDROID_HOME"
          echo '--- JAVA_HOME ---';    echo "$JAVA_HOME"
          echo '--- gradle wrapper ---'; [ -f gradlew ] && ls -la gradlew || echo 'NO gradlew'
          echo '--- app/build.gradle (signingConfigs) ---'
          if [ -f app/build.gradle ]; then
            grep -nA 8 'signingConfigs' app/build.gradle || cat app/build.gradle
          else
            echo 'NO existe app/build.gradle'
          fi
          echo '--- build.gradle raíz ---'
          [ -f build.gradle ] && head -30 build.gradle || echo 'NO existe build.gradle'

      - name: Compilar APK + AAB con Gradle directo (firmado)
        working-directory: twa
        env:
          # Bubblewrap genera el build.gradle leyendo passwords desde estas env vars
          # (probamos todos los nombres comunes para máxima compatibilidad).
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          chmod +x ./gradlew
          # Compila APK + AAB. Si el signingConfig del template lee de env vars,
          # se firma automáticamente. Si pide propiedades de Gradle, las pasamos
          # también con -P por si acaso.
          ./gradlew --no-daemon --stacktrace \
            -PsigningStorePassword="${KEYSTORE_PASSWORD}" \
            -PsigningKeyPassword="${KEY_PASSWORD}" \
            assembleRelease bundleRelease
          echo '--- artefactos producidos ---'
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Mover APK + AAB al directorio twa/ (zipalign + apksigner v1+v2+v3)
        working-directory: twa
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          # 1) Localizar APK y AAB producidos por Gradle (preferimos el "unsigned"
          #    para resignar manualmente con esquemas v1+v2+v3 garantizados, en
          #    vez de depender del signingConfig del template).
          APK_UNSIGNED=$(find app/build/outputs/apk -name '*-unsigned.apk' | head -1)
          APK_ANY=$(find app/build/outputs/apk -name '*.apk' ! -name '*-unsigned.apk' | head -1)
          APK_SRC="${APK_UNSIGNED:-$APK_ANY}"
          AAB_SRC=$(find app/build/outputs/bundle -name '*.aab' | head -1)
          echo "APK fuente: $APK_SRC"
          echo "AAB fuente: $AAB_SRC"
          [ -z "$APK_SRC" ] && { echo "::error::No se encontró APK"; exit 1; }

          # 2) Localizar build-tools (zipalign + apksigner) del Android SDK.
          BT=$(ls -1d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          [ -z "$BT" ] && { echo "::error::Android build-tools no instalado"; exit 1; }

          # 3) zipalign (4-byte alignment, requerido por apksigner v2+).
          "$BT/zipalign" -v -p 4 "$APK_SRC" app-release-aligned.apk

          # 4) Firmar con apksigner habilitando v1 + v2 + v3 schemes (Android 7+).
          "$BT/apksigner" sign \
            --ks android.keystore \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app-release-signed.apk \
            app-release-aligned.apk

          # 5) Verificar firma.
          "$BT/apksigner" verify --verbose --print-certs app-release-signed.apk

          # 6) Copiar AAB tal cual (Gradle ya lo firma para Play Store).
          [ -n "$AAB_SRC" ] && cp "$AAB_SRC" app-release-bundle.aab

          ls -la *.apk *.aab 2>/dev/null || true

      - name: Renombrar artefactos con versión
        working-directory: twa
        run: |
          V="${{ steps.ver.outputs.version_name }}"
          C="${{ steps.ver.outputs.version_code }}"
          [ -f app-release-signed.apk ] && cp app-release-signed.apk "internos-${V}-${C}.apk"
          [ -f app-release-bundle.aab ] && cp app-release-bundle.aab "internos-${V}-${C}.aab"
          ls -la internos-*.apk internos-*.aab 2>/dev/null || true

      - name: Subir APK + AAB como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: internos-v${{ steps.ver.outputs.version_name }}-${{ steps.ver.outputs.version_code }}
          path: |
            twa/internos-*.apk
            twa/internos-*.aab
          retention-days: 90
          if-no-files-found: error

      - name: Mostrar SHA256 del APK (para verificación)
        working-directory: twa
        run: |
          for f in internos-*.apk; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            sha256sum "$f"
            stat -c "Size: %s bytes" "$f"
          done
