<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- InternOS · Bastón de Esculapio v6 — diseño desde cero
       Principio: el I es una letra serif editorial bien construida.
       La serpiente es UN solo trazo sinuoso que pasa por detrás
       del I; la letra crea la oclusión natural y el efecto de wrap.
  -->
  <rect width="512" height="512" rx="112" fill="#fafaf9"/>

  <!-- ═══════════════════════════════════════════════════════════
       CAPA 1 · CUERPO DE LA SERPIENTE
       Un único path bezier continuo: tail (abajo-izq) → head (arriba)
       Oscila izquierda-derecha en 4.5 períodos como onda senoidal.
       ═══════════════════════════════════════════════════════════ -->
  <path fill="none" stroke="#27272a" stroke-width="24" stroke-linecap="round"
        d="M 192 408
           C 232 396 304 396 304 348
           C 304 308 196 308 196 268
           C 196 228 304 228 304 188
           C 304 148 196 148 196 108
           C 196 80 244 60 276 60"/>

  <!-- ═══════════════════════════════════════════════════════════
       CAPA 2 · LETRA I (BASTÓN)
       Construida como path única con serifs editoriales refinados.
       Cubre la banda central, ocultando partes "detrás" de la serpiente.
       ═══════════════════════════════════════════════════════════ -->
  <g fill="#44403c">
    <!-- I serif completa en un solo path -->
    <path d="
      M 156 88
      L 356 88
      L 356 122
      L 320 122
      L 304 132
      L 304 380
      L 320 390
      L 356 390
      L 356 424
      L 156 424
      L 156 390
      L 192 390
      L 208 380
      L 208 132
      L 192 122
      L 156 122
      Z"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       CAPA 3 · CABEZA DE LA SERPIENTE
       Forma triangular almendrada erguida arriba-derecha,
       con ojo blanco con pupila y reflejo.
       ═══════════════════════════════════════════════════════════ -->
  <g>
    <!-- Cuello sale del wrap superior -->
    <path fill="none" stroke="#27272a" stroke-width="22" stroke-linecap="round"
          d="M 276 60 C 284 50 292 44 300 38"/>
    <!-- Cabeza body -->
    <path fill="#18181b" d="
      M 296 60
      C 280 40 296 14 322 12
      C 350 10 372 24 372 50
      C 372 66 364 78 350 80
      L 354 72
      C 344 80 332 78 322 70
      C 308 70 296 66 296 60 Z"/>
    <!-- Highlight superior de la cabeza (subtle dimension) -->
    <path fill="#3f3f46" opacity="0.5" d="
      M 308 24 C 322 18 340 18 354 24 C 344 22 320 22 308 24 Z"/>
    <!-- Ojo: blanco + pupila + reflejo -->
    <circle cx="346" cy="38" r="5" fill="#fafaf9"/>
    <circle cx="347" cy="38.5" r="2.4" fill="#18181b"/>
    <circle cx="347.5" cy="36.8" r="0.8" fill="#fafaf9"/>
    <!-- Fosa nasal -->
    <ellipse cx="364" cy="52" rx="1.8" ry="1.2" fill="#fafaf9" opacity="0.7"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       CAPA 4 · LENGUA BÍFIDA EN Y
       Saliendo de la boca, erecta hacia arriba.
       ═══════════════════════════════════════════════════════════ -->
  <g fill="none" stroke="#27272a" stroke-width="3.5"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Tronco principal -->
    <path d="M 366 28 L 384 4"/>
    <!-- Bifurcación izquierda -->
    <path d="M 384 4 L 376 -6"/>
    <!-- Bifurcación derecha -->
    <path d="M 384 4 L 396 -2"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       CAPA 5 · COLA
       Pequeña terminación afinada abajo-izquierda.
       ═══════════════════════════════════════════════════════════ -->
  <path fill="none" stroke="#27272a" stroke-width="12" stroke-linecap="round"
        d="M 192 408 Q 178 416 164 416"/>
</svg>
