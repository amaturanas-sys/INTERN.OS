<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- InternOS · Símbolo principal — Bastón de Esculapio
       La "I" de Intern.OS, construida como el bastón de Esculapio:
       un vástago vertical con remates serif (estilo Mayo Clinic) y
       una serpiente coilada alrededor en 4 vueltas alternadas.
       Monocromo teal (#0d8a8c) — color de acento de la paleta.
  -->
  <rect width="512" height="512" rx="112" fill="#fafaf9"/>

  <g fill="#0d8a8c">
    <!-- ===== Serpiente: 4 arcos alternados (atrás/adelante del vástago) ===== -->
    <g fill="none" stroke="#0d8a8c" stroke-width="14" stroke-linecap="round">
      <!-- Arco 1 (derecha) -->
      <path d="M256 160 Q 308 187 256 214"/>
      <!-- Arco 2 (izquierda) -->
      <path d="M256 214 Q 204 241 256 268"/>
      <!-- Arco 3 (derecha) -->
      <path d="M256 268 Q 308 295 256 322"/>
      <!-- Arco 4 (izquierda) -->
      <path d="M256 322 Q 204 349 256 376"/>
    </g>

    <!-- ===== Bastón en I serif: serif sup + vástago + serif inf ===== -->
    <!-- Serif superior -->
    <rect x="206" y="78" width="100" height="14" rx="2"/>
    <!-- Sub-serifs (caps detail tipo Trajan/Mayo) -->
    <rect x="206" y="92" width="6" height="6"/>
    <rect x="300" y="92" width="6" height="6"/>
    <!-- Vástago -->
    <rect x="246" y="92" width="20" height="336" rx="2"/>
    <!-- Sub-serifs inferiores -->
    <rect x="206" y="414" width="6" height="6"/>
    <rect x="300" y="414" width="6" height="6"/>
    <!-- Serif inferior -->
    <rect x="206" y="420" width="100" height="14" rx="2"/>

    <!-- ===== Cabeza de serpiente (en frente, asomando arriba a la derecha) ===== -->
    <path d="M266 148
             C 286 140 304 146 308 158
             C 312 174 296 184 280 180
             C 268 178 262 168 266 158
             Z"/>
    <!-- Ojo de la serpiente -->
    <circle cx="296" cy="158" r="2.5" fill="#fafaf9"/>

    <!-- ===== Cola asomando abajo a la izquierda ===== -->
    <path fill="none" stroke="#0d8a8c" stroke-width="12" stroke-linecap="round"
          d="M256 376 C 240 386 224 392 212 402"/>
  </g>
</svg>
