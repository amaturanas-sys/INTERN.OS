<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- InternOS · Bastón de Esculapio v4
       Estilo Star of Life (medicina de emergencia):
       vástago vertical con remates serif sutiles (lee como "I"),
       serpiente coilada en arcos C alternados subiendo,
       cabeza erguida arriba con lengua bífida. Grayscale.
  -->
  <rect width="512" height="512" rx="112" fill="#ffffff"/>

  <g fill="#3f3f46" stroke="#3f3f46" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== Vástago (la I): rod central con serifs sutiles ===== -->
    <!-- Serif superior fino -->
    <rect x="208" y="110" width="96" height="12" rx="2" stroke="none"/>
    <!-- Vástago grueso pero proporcionado -->
    <rect x="244" y="122" width="24" height="276" stroke="none"/>
    <!-- Serif inferior fino -->
    <rect x="208" y="398" width="96" height="12" rx="2" stroke="none"/>

    <!-- ===== Serpiente: cuerpo en arcos C alternados subiendo
         alrededor del vástago. 5 arcos visibles (2 vueltas + medio arco al tope). ===== -->
    <g fill="none" stroke-width="16">
      <!-- Arco 1: derecha, abajo -->
      <path d="M 256 372 C 304 372 304 322 256 322"/>
      <!-- Arco 2: izquierda -->
      <path d="M 256 322 C 208 322 208 272 256 272"/>
      <!-- Arco 3: derecha -->
      <path d="M 256 272 C 304 272 304 222 256 222"/>
      <!-- Arco 4: izquierda -->
      <path d="M 256 222 C 208 222 208 172 256 172"/>
      <!-- Arco 5: derecha (final, sube hacia cabeza) -->
      <path d="M 256 172 C 304 172 312 132 296 96"/>
    </g>

    <!-- ===== Cola peeking abajo-izquierda ===== -->
    <path fill="none" stroke-width="11"
          d="M 256 372 C 244 384 232 390 218 392"/>

    <!-- ===== Cabeza erguida arriba-derecha ===== -->
    <!-- Cabeza: oval inclinado pointing up-right, with rounded snout -->
    <g>
      <path d="M 280 100
               C 268 84 274 60 290 50
               C 308 40 328 46 334 64
               C 338 80 332 92 324 96
               L 322 92
               C 318 96 312 96 308 92
               C 306 96 302 100 296 102
               C 290 102 284 100 280 100 Z"
            stroke="none"/>
      <!-- Ojo de la serpiente -->
      <circle cx="312" cy="62" r="4" fill="#ffffff" stroke="none"/>
    </g>

    <!-- ===== Lengua bífida saliendo de la boca (Y-shape) ===== -->
    <g fill="none" stroke-width="3.5">
      <!-- Tronco principal -->
      <path d="M 330 50 L 348 24"/>
      <!-- Bifurcación izquierda -->
      <path d="M 348 24 L 340 14"/>
      <!-- Bifurcación derecha -->
      <path d="M 348 24 L 358 20"/>
    </g>
  </g>
</svg>
