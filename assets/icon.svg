<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620">
  <!-- Asclepio: vectorización en line-art delgado y elegante de la estatua de referencia.
       Blanco y negro · trazo fino 1.4-1.8px · estilo ilustración editorial. -->
  <rect width="360" height="620" fill="#ffffff"/>

  <g fill="none" stroke="#0e0e10" stroke-linecap="round" stroke-linejoin="round">

    <!-- ═══════════════════ CABEZA ═══════════════════ -->
    <g stroke-width="1.6">
      <!-- Volumen del cabello rizado (top y laterales) -->
      <path d="M 138 60
               C 132 42 144 30 158 32
               C 168 24 188 24 200 32
               C 215 30 226 44 224 62
               C 230 70 232 82 228 92"/>
      <!-- Lado derecho de la cabeza/sien hacia la barba -->
      <path d="M 228 92
               C 232 110 230 132 224 148
               C 220 158 215 165 208 168"/>
      <!-- Lado izquierdo desde la coronilla hacia abajo -->
      <path d="M 138 60
               C 134 80 132 100 132 120
               C 134 138 142 152 152 162"/>
      <!-- Oreja sugerida -->
      <path d="M 220 130 Q 226 138 222 148"/>
    </g>

    <!-- Mechones de pelo rizado (suggestive curls) -->
    <g stroke-width="1.2">
      <path d="M 146 50 Q 152 56 146 64"/>
      <path d="M 160 42 Q 168 48 162 58"/>
      <path d="M 178 40 Q 188 46 184 58"/>
      <path d="M 198 44 Q 208 50 206 62"/>
      <path d="M 140 90 Q 144 100 140 110"/>
      <path d="M 226 100 Q 230 110 226 122"/>
    </g>

    <!-- Ceja, ojo, nariz, boca -->
    <g stroke-width="1.4">
      <!-- Ceja -->
      <path d="M 168 108 Q 178 105 188 108"/>
      <!-- Ojo -->
      <path d="M 170 116 Q 180 112 192 116 Q 188 122 178 122 Q 172 121 170 116 Z"/>
      <circle cx="183" cy="118" r="1.5" fill="#0e0e10" stroke="none"/>
      <!-- Nariz -->
      <path d="M 198 118
               Q 204 134 200 148
               Q 198 154 204 156"/>
      <!-- Mostacho -->
      <path d="M 178 162 Q 188 158 200 162"/>
    </g>

    <!-- Barba completa con rizos -->
    <g stroke-width="1.5">
      <path d="M 152 162
               Q 142 178 142 200
               Q 144 220 158 232
               Q 178 240 198 232
               Q 214 222 218 200
               Q 218 178 208 162"/>
      <!-- Bucles de la barba (sugestivos) -->
      <path d="M 155 178 Q 160 188 156 198" stroke-width="1.1"/>
      <path d="M 168 188 Q 174 200 170 212" stroke-width="1.1"/>
      <path d="M 182 192 Q 188 205 184 218" stroke-width="1.1"/>
      <path d="M 196 188 Q 202 200 200 215" stroke-width="1.1"/>
      <path d="M 208 180 Q 213 192 208 202" stroke-width="1.1"/>
    </g>

    <!-- ═══════════════════ CUELLO + TORSO ═══════════════════ -->
    <g stroke-width="1.6">
      <!-- Cuello (dos líneas suaves) -->
      <path d="M 162 232 Q 165 252 172 266"/>
      <path d="M 200 232 Q 202 254 197 266"/>
      <!-- Clavículas -->
      <path d="M 150 268 Q 175 275 198 268 Q 220 270 232 280"/>
      <!-- Pectoral izquierdo (figura) — derecho de la imagen -->
      <path d="M 152 280
               Q 155 305 168 320
               Q 178 326 188 322"/>
      <!-- Línea central del pecho -->
      <path d="M 178 280 Q 180 305 184 332"/>
      <!-- Pectoral derecho (figura) bajo el drapeado -->
      <path d="M 200 282 Q 215 295 230 298"/>
      <!-- Línea abdominal suave -->
      <path d="M 162 332 Q 180 340 198 332"/>
      <path d="M 165 360 Q 182 366 198 360"/>
    </g>

    <!-- ═══════════════════ HOMBRO + BRAZO IZQUIERDO (de la figura, derecho de la imagen) ═══════════════════ -->
    <!-- Brazo a la altura del pecho sosteniendo objeto -->
    <g stroke-width="1.6">
      <!-- Hombro y bíceps -->
      <path d="M 232 280
               Q 248 290 258 308
               Q 262 320 256 332"/>
      <!-- Antebrazo cruzando hacia el pecho -->
      <path d="M 256 332
               Q 248 340 232 342
               Q 218 342 208 336"/>
      <!-- Mano cerrada en el pecho -->
      <path d="M 208 336
               Q 200 340 200 350
               Q 204 358 214 358
               Q 222 354 222 346"/>
      <!-- Objeto en la mano (piña / vasija pequeña) -->
      <path d="M 215 358
               Q 215 370 220 378
               Q 226 380 230 374
               Q 232 366 228 358"/>
      <path d="M 218 364 L 224 364" stroke-width="1.0"/>
      <path d="M 218 370 L 226 370" stroke-width="1.0"/>
    </g>

    <!-- ═══════════════════ HOMBRO + BRAZO DERECHO (figura) sosteniendo bastón ═══════════════════ -->
    <g stroke-width="1.6">
      <!-- Hombro izquierdo (imagen) -->
      <path d="M 150 280
               Q 130 285 116 300
               Q 105 318 102 340"/>
      <!-- Bíceps cayendo -->
      <path d="M 102 340
               Q 98 380 100 420
               Q 102 442 108 450"/>
      <!-- Mano que agarra el bastón -->
      <path d="M 108 450
               Q 100 460 102 472
               Q 110 478 122 472
               Q 128 462 126 452"/>
    </g>

    <!-- ═══════════════════ DRAPEADO (himation sobre el hombro derecho de la figura) ═══════════════════ -->
    <g stroke-width="1.5">
      <!-- Borde superior del manto, cae desde el hombro -->
      <path d="M 232 280
               Q 252 300 268 330
               Q 280 370 285 420
               Q 286 470 280 520
               Q 276 555 272 580"/>
      <!-- Pliegues verticales del drapeado -->
      <path d="M 260 340
               Q 258 380 262 430
               Q 264 480 260 530
               Q 258 560 254 580"/>
      <path d="M 240 350
               Q 238 400 242 450
               Q 244 500 242 540
               Q 240 560 236 580"/>
      <path d="M 222 380
               Q 220 420 222 470
               Q 224 510 222 540
               Q 220 558 218 580"/>
      <!-- Pliegue inferior (cintura/cadera) -->
      <path d="M 165 405
               Q 188 415 215 408
               Q 245 405 268 410"/>
      <!-- Pliegues que caen desde la cintura -->
      <path d="M 178 415
               Q 175 460 178 500
               Q 180 535 178 565"/>
      <path d="M 200 415
               Q 200 460 200 500
               Q 200 535 200 565"/>
    </g>

    <!-- ═══════════════════ PIERNAS + PIES ═══════════════════ -->
    <g stroke-width="1.6">
      <!-- Piernas asomando bajo el drapeado -->
      <path d="M 162 540 Q 165 565 170 580"/>
      <path d="M 195 540 Q 195 565 195 580"/>
      <!-- Pie izquierdo (imagen) -->
      <path d="M 152 580
               L 192 580
               Q 200 584 195 590
               L 150 590
               Q 144 588 152 580 Z"/>
      <!-- Pie derecho (imagen) -->
      <path d="M 198 580
               L 232 580
               Q 240 584 235 590
               L 198 590
               Q 192 588 198 580 Z"/>
      <!-- Sandalias: tiras -->
      <path d="M 165 583 L 168 578" stroke-width="1.1"/>
      <path d="M 180 583 L 184 578" stroke-width="1.1"/>
      <path d="M 210 583 L 213 578" stroke-width="1.1"/>
      <path d="M 222 583 L 225 578" stroke-width="1.1"/>
    </g>

    <!-- ═══════════════════ BASTÓN DE MADERA ═══════════════════ -->
    <g stroke-width="1.6">
      <!-- Vástago vertical, ligeramente irregular -->
      <path d="M 103 240
               Q 105 280 107 320
               Q 105 360 108 400
               Q 106 440 108 480
               Q 106 520 108 560
               Q 106 580 110 590"/>
      <path d="M 122 240
               Q 124 280 126 320
               Q 124 360 127 400
               Q 125 440 128 480
               Q 126 520 128 560
               Q 126 580 130 590"/>
      <!-- Punta superior achatada -->
      <path d="M 103 240 Q 113 232 122 240"/>
      <!-- Nudos del bastón (donde se cortaron ramitas) -->
      <ellipse cx="115" cy="318" rx="8" ry="4" stroke-width="1.2"/>
      <ellipse cx="113" cy="405" rx="7" ry="4" stroke-width="1.2"/>
      <ellipse cx="116" cy="495" rx="8" ry="4" stroke-width="1.2"/>
      <!-- Pequeñas ramitas/ojos de nudo -->
      <path d="M 110 318 L 113 322" stroke-width="1.0"/>
      <path d="M 112 405 L 115 408" stroke-width="1.0"/>
    </g>

    <!-- ═══════════════════ SERPIENTE ═══════════════════ -->
    <g stroke-width="1.5">
      <!-- Cabeza arriba mirando a la izquierda -->
      <path d="M 100 248
               Q 86 250 80 262
               Q 78 272 86 276
               Q 95 276 102 268
               Q 105 260 100 248 Z"/>
      <!-- Ojo de la serpiente -->
      <circle cx="89" cy="263" r="1.1" fill="#0e0e10" stroke="none"/>
      <!-- Lengua bífida pequeña -->
      <path d="M 82 268 L 74 272" stroke-width="0.9"/>
      <path d="M 74 272 L 71 270" stroke-width="0.9"/>
      <path d="M 74 272 L 72 275" stroke-width="0.9"/>

      <!-- Cuerpo serpenteando: 5 vueltas visibles alternadas -->
      <!-- Vuelta 1 (alto): cuerpo cruza desde tras el bastón a la izquierda -->
      <path d="M 100 278
               Q 88 290 94 310
               Q 102 326 96 348"/>
      <!-- Vuelta 1 derecha (sale por el otro lado) -->
      <path d="M 130 298
               Q 140 312 136 330
               Q 130 348 138 370"/>
      <!-- Vuelta 2 izquierda -->
      <path d="M 96 360
               Q 86 376 94 396
               Q 102 412 96 432"/>
      <!-- Vuelta 2 derecha -->
      <path d="M 138 384
               Q 146 402 138 422
               Q 130 442 138 462"/>
      <!-- Vuelta 3 izquierda -->
      <path d="M 96 444
               Q 88 462 96 482
               Q 104 500 96 522"/>
      <!-- Vuelta 3 derecha -->
      <path d="M 138 476
               Q 144 496 136 516
               Q 128 538 132 558"/>
      <!-- Cola colgante final -->
      <path d="M 96 530
               Q 92 555 96 580
               Q 100 590 105 590"/>
    </g>

    <!-- ═══════════════════ BASE / PEDESTAL ═══════════════════ -->
    <g stroke-width="1.4">
      <!-- Forma ovalada superior e inferior -->
      <ellipse cx="180" cy="595" rx="115" ry="8"/>
      <path d="M 65 595 L 65 606"/>
      <path d="M 295 595 L 295 606"/>
      <path d="M 65 606 Q 180 614 295 606"/>
      <!-- Plaqueta con texto -->
      <rect x="148" y="599" width="64" height="9" stroke-width="0.9"/>
    </g>

    <!-- Texto "ASCLEPIUS" -->
    <text x="180" y="606" text-anchor="middle"
          font-family="'Georgia', 'Times New Roman', serif"
          font-size="7" letter-spacing="1.8"
          fill="#0e0e10" stroke="none">ASCLEPIUS</text>

  </g>
</svg>
